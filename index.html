<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Escudos Burgos</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>html,body,#map{height:100%;margin:0}body{font-family:system-ui;background:#fff}#map{background:#fff}.panel{position:fixed;z-index:9;left:10px;top:10px;width:min(380px,calc(100% - 20px));max-height:55vh;overflow:auto;background:#fff;border:1px solid #ddd;border-radius:14px;padding:12px;box-shadow:0 5px 25px #0002}.row{padding:7px;border-top:1px solid #eee;cursor:pointer}.shield{object-fit:contain;filter:drop-shadow(0 2px 2px #0005)}.name{font-size:11px;font-weight:600;white-space:nowrap;text-shadow:0 0 3px #fff,0 0 3px #fff}.buttons{display:flex;gap:6px;flex-wrap:wrap}button,input{padding:8px;border:1px solid #ccc;border-radius:9px;background:#fff}input{width:100%;box-sizing:border-box;margin:6px 0}</style></head><body><div id="map"></div><div class="panel"><b>Escudos de los municipios de Burgos</b><div><span id="count">0</span> / 371</div><input id="search" placeholder="Buscar municipio…"><div class="buttons"><button id="burgos">Burgos</button><button id="fullscreen">Pantalla completa</button><button id="only">Solo escudos</button></div><div id="list"></div><div id="edit"></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://unpkg.com/topojson-client@3"></script><script>
const M='https://raw.githubusercontent.com/codeforspain/ds-organizacion-administrativa/master/data/municipios.json',G='https://unpkg.com/es-atlas/es/municipalities.json';
const map=L.map('map',{attributionControl:false,minZoom:4,maxZoom:18}).setView([42.2,-3.6],7),labels=L.layerGroup().addTo(map),shields=L.layerGroup().addTo(map),lines=L.layerGroup().addTo(map);
let ms=[],selected=null,only=false,db;
const norm=s=>(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().trim();
function openDB(){return new Promise((ok,no)=>{let r=indexedDB.open('burgos-escudos',1);r.onupgradeneeded=()=>r.result.createObjectStore('x',{keyPath:'id'});r.onsuccess=()=>{db=r.result;ok()};r.onerror=()=>no(r.error)})}
function get(id){return new Promise(ok=>{let r=db.transaction('x').objectStore('x').get(id);r.onsuccess=()=>ok(r.result||{})})}
function put(x){db.transaction('x','readwrite').objectStore('x').put(x)}
function center(f){return L.geoJSON(f).getBounds().getCenter()}
function pname(f){let p=f.properties||{};return p.name||p.NAMEUNIT||p.nombre||p.NOMBRE||p.municipio||p.MUNICIPIO||''}
function icon(x){let z=map.getZoom(),k=z<7?0:z<8?.18:z<9?.3:z<10?.45:z<11?.62:z<12?.78:1,s=Math.max(2,Math.round((x.size||70)*k));return x.image&&k?L.divIcon({className:'',html:'<img class="shield" src="'+x.image+'" style="width:'+s+'px;height:'+s+'px">',iconSize:[s,s],iconAnchor:[s/2,s]}):null}
async function draw(){shields.clearLayers();for(let m of ms){let x=await get(m.id),i=icon(x);if(i){let q=L.marker(m.ll,{icon:i,draggable:!x.locked});q.on('click',()=>edit(m));q.on('dragend',e=>{let p=e.target.getLatLng();x.lat=p.lat;x.lng=p.lng;put(x);m.ll=p});shields.addLayer(q)}}}
function drawLabels(){labels.clearLayers();if(only)return;for(let m of ms){let i=L.divIcon({className:'',html:'<div class="name">'+m.nombre.replace(/[&<>]/g,'')+'</div>',iconSize:[1,1]});labels.addLayer(L.marker(m.ll,{icon:i,interactive:false}))}}
function edit(m){selected=m;get(m.id).then(x=>{document.getElementById('edit').innerHTML='<hr><b>'+m.nombre+'</b><br><input id="file" type="file" accept="image/png,image/jpeg,image/webp"><br>Tamaño <input id="size" type="range" min="30" max="180" value="'+(x.size||70)+'"><br><button id="fav">'+(x.favorite?'★':'☆')+' Favorito</button> <button id="lock">'+(x.locked?'🔒 Desbloquear':'🔓 Bloquear')+'</button> <button id="del">Eliminar</button>';document.getElementById('file').onchange=e=>{let f=e.target.files[0],r=new FileReader();r.onload=()=>{x.id=m.id;x.image=r.result;x.size=x.size||70;put(x);draw();count();edit(m)};r.readAsDataURL(f)};document.getElementById('size').oninput=e=>{x.id=m.id;x.size=+e.target.value;put(x);draw()};document.getElementById('fav').onclick=()=>{x.id=m.id;x.favorite=!x.favorite;put(x);edit(m);list()};document.getElementById('lock').onclick=()=>{x.id=m.id;x.locked=!x.locked;put(x);edit(m);draw()};document.getElementById('del').onclick=()=>{if(confirm('¿Eliminar el escudo?')){db.transaction('x','readwrite').objectStore('x').delete(m.id);document.getElementById('edit').innerHTML='';draw();count();list()}}})}
async function count(){let n=0;for(let m of ms)if((await get(m.id)).image)n++;document.getElementById('count').textContent=n}
async function list(){let q=norm(document.getElementById('search').value),b=document.getElementById('list');b.innerHTML='';for(let m of ms.filter(x=>!q||norm(x.nombre).includes(q))){let x=await get(m.id),r=document.createElement('div');r.className='row';r.textContent=(x.favorite?'★ ':'')+m.nombre+(x.image?' ✓':'');r.onclick=()=>{map.setView(m.ll,13);edit(m)};b.appendChild(r)}}
document.getElementById('search').oninput=list;document.getElementById('burgos').onclick=()=>map.fitBounds([[41.95,-4.4],[43.25,-2.8]]);document.getElementById('fullscreen').onclick=()=>document.documentElement.requestFullscreen?.();document.getElementById('only').onclick=()=>{only=!only;drawLabels()};map.on('zoomend',draw);
(async()=>{await openDB();let [a,t]=await Promise.all([fetch(M).then(r=>r.json()),fetch(G).then(r=>r.json())]);a=a.filter(x=>String(x.provincia_id).padStart(2,'0')==='09');if(a.length!==371)throw Error('No se han obtenido exactamente 371 municipios.');let f=topojson.feature(t,t.objects.municipalities).features,by=new Map(f.map(x=>[norm(pname(x)),x]));ms=a.map(x=>{let z=by.get(norm(x.nombre));if(!z)throw Error('Falta geometría para '+x.nombre);return{id:String(x.municipio_id),nombre:x.nombre,ll:center(z)}});let gj=L.geoJSON({type:'FeatureCollection',features:ms.map(m=>by.get(norm(m.nombre)))},{style:{color:'#111',weight:2,fill:false}});lines.addLayer(gj);map.fitBounds([[41.95,-4.4],[43.25,-2.8]]);drawLabels();draw();list();count()})().catch(e=>alert(e.message));
</script></body></html>
