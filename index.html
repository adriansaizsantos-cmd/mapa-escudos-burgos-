<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="description" content="Colección interactiva de escudos de los 371 municipios de la provincia de Burgos.">
  <title>Escudos de Burgos · Colección</title>
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">🛡️</div>
        <div>
          <div class="brand-title">Escudos de Burgos</div>
          <div class="brand-subtitle">Colección municipal · 371 municipios</div>
        </div>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="themeBtn" title="Cambiar apariencia" aria-label="Cambiar apariencia">🌙</button>
        <button class="icon-btn" id="fullscreenBtn" title="Pantalla completa" aria-label="Pantalla completa">⛶</button>
      </div>
    </header>

    <main class="workspace">
      <aside class="sidebar" id="sidebar">
        <section class="stats-card">
          <div class="stats-main">
            <div class="eyebrow">PROGRESO</div>
            <div class="progress-number"><span id="progressCount">0</span><span class="muted"> / 371</span></div>
            <div class="progress-track"><div id="progressBar" class="progress-fill"></div></div>
            <div id="progressPercent" class="progress-percent">0 % completado</div>
          </div>
          <div class="stats-mini">
            <div><span id="favoriteCount">0</span><small>Favoritos</small></div>
            <div><span id="lockedCount">0</span><small>Bloqueados</small></div>
          </div>
        </section>

        <section class="toolbar-card">
          <div class="search-wrap">
            <span>⌕</span>
            <input id="searchInput" type="search" placeholder="Buscar municipio…" autocomplete="off">
          </div>
          <div class="filter-row">
            <button class="filter active" data-filter="all">Todos</button>
            <button class="filter" data-filter="missing">Sin escudo</button>
            <button class="filter" data-filter="complete">Con escudo</button>
            <button class="filter" data-filter="favorites">★ Favoritos</button>
          </div>
        </section>

        <section class="municipality-section">
          <div class="section-heading">
            <span>Municipios</span><span id="visibleCount" class="badge">371</span>
          </div>
          <div id="municipalityList" class="municipality-list">
            <div class="loading-state">Cargando los municipios oficiales…</div>
          </div>
        </section>

        <section class="sidebar-footer">
          <button class="secondary-btn" id="exportBtn">📦 Exportar copia</button>
          <button class="secondary-btn" id="importBtn">📥 Importar copia</button>
          <input id="importInput" type="file" accept="application/json,.json" hidden>
          <button class="secondary-btn" id="arrangeBtn">🧩 Organizar escudos</button>
          <button class="secondary-btn" id="undoBtn" disabled>↩️ Deshacer</button>
        </section>
      </aside>

      <section class="map-panel">
        <div id="map" class="map"></div>

        <div class="map-controls top-left">
          <button class="map-btn" id="burgosBtn" title="Centrar en Burgos">🎯 Burgos</button>
          <button class="map-btn" id="spainBtn" title="Ver España">🇪🇸 España</button>
          <button class="map-btn" id="onlyShieldsBtn" title="Mostrar solo escudos">👁️ Solo escudos</button>
        </div>

        <div class="map-status" id="mapStatus">Preparando mapa…</div>

        <div id="municipalityPanel" class="municipality-panel hidden">
          <div class="panel-head">
            <div>
              <div class="eyebrow">MUNICIPIO</div>
              <h2 id="panelMunicipalityName">—</h2>
            </div>
            <button class="close-btn" id="closePanelBtn" aria-label="Cerrar">×</button>
          </div>
          <div id="panelShieldPreview" class="shield-preview empty">Sin escudo añadido</div>
          <div class="panel-actions">
            <label class="primary-btn upload-btn">🖼️ <span id="uploadLabel">Añadir escudo</span><input id="shieldInput" type="file" accept="image/*" hidden></label>
            <button class="secondary-btn" id="favoriteBtn">☆ Favorito</button>
            <button class="secondary-btn danger" id="deleteShieldBtn">🗑️ Borrar</button>
          </div>
          <div id="shieldControls" class="shield-controls hidden">
            <div class="control-line"><span>Tamaño</span><output id="sizeOutput">120 px</output></div>
            <input id="sizeRange" type="range" min="56" max="260" step="2" value="120">
            <button class="secondary-btn" id="lockBtn">🔒 Bloquear posición</button>
          </div>
        </div>

        <div id="achievementToast" class="achievement-toast hidden"></div>
      </section>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="app.js" type="module"></script>
</body>
</html>
